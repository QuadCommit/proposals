<section class="section" id="scope" data-section>
  <div class="container">
    <header class="section__header reveal reveal-up" data-reveal>
      <p class="section__eyebrow" data-bind="scope.eyebrow">Alcance del Proyecto</p>
      <h2 class="section__title" data-bind="scope.title"></h2>
      <p class="section__description" data-bind="scope.description"></p>
    </header>

    <div class="card-grid card-grid--3 reveal reveal-up" data-reveal data-delay="1">
      <template data-repeat="scope.roles">
        <article class="card card--role">
          <div class="card__top">
            <span class="card__icon" aria-hidden="true"><i data-bind-icon="icon"></i></span>
            <span class="card__role-number" data-bind="$index"></span>
          </div>
          <h3 class="card__title" data-bind="name"></h3>
          <p class="card__text" data-bind="description"></p>
          <ul class="card__list">
            <template data-repeat="abilities">
              <li>
                <i data-lucide="check" class="card__list-icon" aria-hidden="true"></i>
                <span data-bind="."></span>
              </li>
            </template>
          </ul>
        </article>
      </template>
    </div>
  </div>
</section>

<section class="section" id="pricing" data-section>
  <div class="container">
    <header class="section__header reveal reveal-up" data-reveal>
      <p class="section__eyebrow" data-bind="pricing.eyebrow">Inversión</p>
      <h2 class="section__title" data-bind="pricing.title"></h2>
      <p class="section__description" data-bind="pricing.description"></p>
    </header>

    <div class="pricing">
      <div class="pricing__summary reveal reveal-up" data-reveal data-delay="1">
        <div class="pricing__total">
          <span class="pricing__label" data-bind="pricing.total.label">Desarrollo Integral MVP</span>
          <div class="pricing__amount">
            <span class="pricing__currency" data-bind="pricing.total.currency">USD</span>
            <strong data-bind="pricing.total.amount">$1,800</strong>
          </div>
          <span class="pricing__tax" data-bind="pricing.total.taxNote"></span>
          <span class="pricing__grand" data-bind="pricing.total.totalWithTax"></span>
        </div>
        <div class="pricing__note">
          <i data-lucide="info" aria-hidden="true"></i>
          <p data-bind="pricing.total.note"></p>
        </div>
      </div>

      <div class="pricing__milestones">
        <template data-repeat="pricing.milestones">
          <article class="milestone">
            <div class="milestone__top">
              <span class="milestone__icon" aria-hidden="true"><i data-bind-icon="icon"></i></span>
              <span class="milestone__percent" data-bind="percent"></span>
            </div>
            <div class="milestone__body">
              <h3 data-bind="name"></h3>
              <p data-bind="trigger"></p>
            </div>
            <div class="milestone__amount">
              <strong data-bind="amount"></strong>
              <span>Pago por hito</span>
            </div>
          </article>
        </template>
      </div>
    </div>

    <article class="maintenance-card reveal reveal-up" data-reveal data-delay="2">
      <div class="maintenance-card__head">
        <span class="maintenance-card__icon" aria-hidden="true"><i data-lucide="wrench"></i></span>
        <div class="maintenance-card__body">
          <p class="maintenance-card__eyebrow" data-bind="pricing.maintenance.eyebrow">Continuidad operativa</p>
          <h3 data-bind="pricing.maintenance.title">Mantenimiento y soporte</h3>
          <p data-bind="pricing.maintenance.description"></p>
        </div>
        <div class="maintenance-card__price">
          <strong data-bind="pricing.maintenance.amount">$50</strong>
          <span data-bind="pricing.maintenance.period">USD / mes</span>
        </div>
      </div>
      <ul class="maintenance-card__list">
        <template data-repeat="pricing.maintenance.items">
          <li>
            <i data-lucide="check" aria-hidden="true"></i>
            <span data-bind="."></span>
          </li>
        </template>
      </ul>
      <p class="maintenance-card__note" data-bind="pricing.maintenance.note"></p>
    </article>

    <div class="card-grid card-grid--3 reveal reveal-up" data-reveal data-delay="3">
      <template data-repeat="pricing.terms">
        <article class="card card--hover">
          <div class="card__top">
            <span class="card__icon" aria-hidden="true"><i data-bind-icon="icon"></i></span>
          </div>
          <h3 class="card__title" data-bind="title"></h3>
          <p class="card__text" data-bind="description"></p>
        </article>
      </template>
    </div>

    <div class="callout callout--warning reveal reveal-up" data-reveal data-delay="4">
      <div class="callout__head">
        <i data-lucide="minus-circle" class="callout__icon" aria-hidden="true"></i>
        <h3 data-bind="pricing.exclusions.title">Exclusiones del MVP</h3>
      </div>
      <ul class="callout__list">
        <template data-repeat="pricing.exclusions.items">
          <li data-bind="."></li>
        </template>
      </ul>
    </div>
  </div>
</section>
